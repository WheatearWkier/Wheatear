schema: wheatear.input.actions.v1
# 输入动作定义表（数据驱动默认键位）。
# - 引擎内置动作表：位于引擎资产根 assets/input/action_bindings.yaml，
#   所有项目共享；项目可在自己的 assets/input/action_bindings.yaml 里
#   覆盖默认键、追加新动作，或把内置动作标记 disabled。
# - 键名与运行时 KeyName 输出一致（大小写不敏感）：A-Z、0-9、F1-F12、
#   Space/Enter/Esc/Tab/Backspace/Delete/Left/Right/Up/Down/Home/End/
#   Shift/Ctrl/Alt、Mouse Left / Mouse Right / Mouse Middle。
# - 编辑器「输入绑定」面板可增删动作并写回项目文件。

actions:
  - id: move.left
    label: "移动-左 / Move Left"
    defaults: ["A", "Left"]
  - id: move.right
    label: "移动-右 / Move Right"
    defaults: ["D", "Right"]
  - id: move.up
    label: "移动-上 / Move Up"
    defaults: ["W", "Up"]
  - id: move.down
    label: "移动-下 / Move Down"
    defaults: ["S", "Down"]
  - id: game.pause
    label: "暂停 / Pause"
    defaults: ["P", "Esc"]
  - id: game.confirm
    label: "确认 / Confirm"
    defaults: ["Space", "Enter", "Right"]
  - id: side.jump
    label: "横版-跳跃 / Jump"
    defaults: ["K", "Space"]
  - id: side.basic
    label: "横版-普攻 / Basic Attack"
    defaults: ["J", "Mouse Left"]
  - id: side.launcher
    label: "横版-升龙 / Launcher"
    defaults: ["E"]
  - id: side.magic
    label: "横版-魔法弹 / Magic Bolt"
    defaults: ["U"]
  - id: side.support
    label: "横版-援护 / Ally Support"
    defaults: ["H"]
  - id: side.dash
    label: "横版-冲刺 / Dash"
    defaults: ["I"]
  - id: side.break_limit
    label: "横版-断限追击 / Break Limit"
    defaults: ["L"]
  - id: side.item1
    label: "横版-道具1 / Item 1"
    defaults: ["1"]
  - id: side.item2
    label: "横版-道具2 / Item 2"
    defaults: ["2"]
  - id: side.item3
    label: "横版-道具3 / Item 3"
    defaults: ["3"]
  - id: arcade.attack
    label: "街机-射击 / Fire"
    defaults: ["J", "Space", "Mouse Left"]
  - id: arcade.weapon1
    label: "街机-武器1 / Weapon 1"
    defaults: ["1"]
  - id: arcade.weapon2
    label: "街机-武器2 / Weapon 2"
    defaults: ["2"]
  - id: arcade.weapon3
    label: "街机-武器3 / Weapon 3"
    defaults: ["3"]
  - id: vn.advance
    label: "剧情-推进 / Advance"
    defaults: ["Space", "Enter", "Right"]
  - id: vn.auto
    label: "剧情-自动播放 / Auto Play"
    defaults: ["A"]
  - id: vn.history
    label: "剧情-历史记录 / History"
    defaults: ["H"]
  - id: vn.save
    label: "剧情-存档 / Save"
    defaults: ["F5"]
  - id: vn.load
    label: "剧情-读档 / Load"
    defaults: ["F9"]

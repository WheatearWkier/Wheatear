    cellWidth: 320
    cellHeight: 192
    frameCount: 4
    frameRate: 26.0
    pivotX: 160
    pivotY: 96
    attach: player sword arc
    runtimeSheet: assets/vertical_slice/side_combat/vfx_sheets/runtime_effects/vfx_basic_slash_sheet.png
    sourceFrames: WheatearEditor/assets/vertical_slice/source_frames/batch06_runtime_vfx/vfx_basic_slash/vfx_basic_slash_{frame:03}.png

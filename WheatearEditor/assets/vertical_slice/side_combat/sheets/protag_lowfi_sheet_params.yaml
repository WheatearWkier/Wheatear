productionMode: programmatic_lowfi_validation
transparentPngRule:
  requireRgba: true
  unusedPixelsAlpha: 0
  generatedWithAi: false
  purpose: engineering validation placeholder, not final art

profiles:
  body_512:
    cellWidth: 512
    cellHeight: 512
    pivot: bottom_center
    pivotX: 256
    pivotY: 430
    baselineY: 430
    renderOffset: [-256, -430]
    safePadding: [48, 48, 48, 40]
  slash_640:
    cellWidth: 640
    cellHeight: 512
    pivot: bottom_center
    pivotX: 320
    pivotY: 430
    baselineY: 430
    renderOffset: [-320, -430]
    safePadding: [64, 48, 96, 40]

clips:
  protag_run_lowfi_strip:
    frameCount: 4
    frameRate: 8
    profile: body_512
    sourceFrames: WheatearEditor/assets/vertical_slice/source_frames/protag_run_lowfi/protag_run_lowfi_{frame:03}.png
    output: WheatearEditor/assets/vertical_slice/side_combat/sheets/protag_run_lowfi_strip.png
    loop: true
    assembledFromSourceFrames: true
    noCrossCellBleed: true
  protag_basic1_lowfi_strip:
    frameCount: 4
    frameRate: 14
    profile: body_512
    sourceFrames: WheatearEditor/assets/vertical_slice/source_frames/protag_basic1_lowfi/protag_basic1_lowfi_{frame:03}.png
    output: WheatearEditor/assets/vertical_slice/side_combat/sheets/protag_basic1_lowfi_strip.png
    loop: false
    assembledFromSourceFrames: true
    noCrossCellBleed: true
    actionArc: [startup, windup, active_slash, follow_through, recovery]

validation:
  fixedCanvasPerClip: true
  pivotBaselineStable: true
  visualScaleStable: true
  collisionIndependentFromCanvas: true

schema: wheatear.side_combat.tuning.v1
version: 0.6.0

# 玩家手感。跳跃高度主要由 jumpImpulse 决定，gravity 越高下落越快。
player:
  moveSpeed: 5.4
  maxJumps: 1
  jumpImpulse: 12.6
  gravity: 16.2
  airControl: 13.0
  laneSpeedScale: 0.72
  laneAcceleration: 30.0
  groundAcceleration: 40.0
  groundFriction: 18.0
  basicCooldown: 0.19
  basicFinisherExtraCooldown: 0.08
  launcherCooldown: 0.42
  magicBoltCooldown: 0.64
  allySupportCooldown: 4.2
  basicChainWindow: 0.72
  launcherChainWindow: 0.82
  magicChainWindow: 0.78
  supportChainWindow: 1.0

# 通用战斗规则。defenseBase 越大，防御减伤越温和。
combat:
  comboDropDelay: 1.15
  hitInvulnerableTime: 0.06
  defenseBase: 100.0
  minDamage: 1.0

# 空连高度资源。空中攻击命中会滞空，但仍会按 fallStep 慢慢下坠。
airCombo:
  airActionLimit: 3
  airActionLimitAfterBreak: 3
  breakLimitEnabled: false
  breakLimitDebugKeyEnabled: false
  showBreakLimitHint: false
  airBasicCooldown: 0.16
  airChaseCooldown: 0.36
  breakLimitCooldown: 3.0
  breakLimitMinCombo: 4
  breakLimitGaugeCost: 1.0
  magicSwordGaugeMax: 3.0
  gaugeGainGroundHit: 0.10
  gaugeGainAirHit: 0.16
  breakLimitMaxHeight: 2.85
  breakLimitFallingVelocity: 2.2
  breakLimitHangImpulse: 2.9
  breakLimitHeightBoost: 0.34
  groundThreatHeight: 1.25
  highAirSafetyHeight: 2.35

# Boss 保护条。满槽后 Boss 强制脱离连击；后期断限用于压回保护条。
protection:
  bossProtectionMax: 100.0
  bossProtectionDecayPerSecond: 16.0
  bossProtectionLimitTime: 1.15
  bossProtectionForceFallVelocity: -6.0
  bossProtectionBreakLimitThreshold: 35.0
  breakLimitProtectionReduce: 42.0
  groundResetDelay: 0.20
  showBossProtectionHud: false
  showCombatStateHud: false

# 敌人 AI 与 Boss 阶段参数。
enemy:
  initialAttackDelay: 0.35
  attackRangePadding: 0.45
  laneAttackPadding: 0.28
  bossPreferredRangeBonus: 0.45
  gruntMoveSpeedScale: 0.88
  bossMoveSpeedScale: 0.62
  gruntLaneSpeedScale: 0.68
  bossLaneSpeedScale: 0.46
  xApproachAcceleration: 24.0
  xBrakeAcceleration: 20.0
  laneApproachAcceleration: 18.0
  laneBrakeAcceleration: 16.0
  bearBoss:
    moveSpeed: 3.4
    aggroRange: 12.0
    attackRange: 1.55
    preferredRange: 1.2
    attackInterval: 1.18
    laneTolerance: 0.58
    midHealthThreshold: 0.68
    lowHealthThreshold: 0.36
    midAttackInterval: 0.96
    lowAttackInterval: 0.78
    chargeDistance: 1.8
    shockwaveDistance: 2.0
    chargeSpeed: 5.8

# 掉落物拾取手感。
pickup:
  pickupRadius: 0.45
  attractRadius: 2.25
  attractSpeed: 6.0

movement:
  laneMinY: -3.55
  laneMaxY: -1.25
  laneSpeedScale: 1.0
  laneAcceleration: 30.0
  sortScale: 0.015

visuals:
  shadowMinAlpha: 0.20
  shadowMaxAlpha: 0.44
  shadowAirFadeHeight: 3.8

reactions:
  bossLaunchBonus: 1.42

skills:
  basic_attack:
    displayName: 三段斩
    input: J
    comboRole: 地面起手 / 基础续连
    attackIds: [basic1, basic2, basic3]
    unlockChapter: 2
    coreMove: true
  air_basic:
    displayName: 跳斩
    input: 空中 J
    comboRole: 前期默认空中续连
    attackIds: [air_basic]
    unlockChapter: 2
    coreMove: true
  launcher:
    displayName: 裂空上挑
    input: K
    comboRole: 地面浮空起手
    attackIds: [launcher]
    unlockChapter: 2
    coreMove: true
  air_chase:
    displayName: 空中追斩
    input: 空中 K
    comboRole: 空中续连 / 低空补救
    attackIds: [air_chase]
    unlockChapter: 2
    coreMove: true
  magic_bolt:
    displayName: 火球术
    input: U
    comboRole: 远程补 hit / 空中魔法续连
    attackIds: [magic_bolt]
    unlockChapter: 2
    coreMove: true
  ally_support:
    displayName: 真青梅支援
    input: I
    comboRole: 支援浮空 / 新手容错
    attackIds: [ally_support]
    unlockChapter: 2
    coreMove: true
  break_limit:
    displayName: 断限追击
    input: L
    comboRole: Boss 保护临界时刷新空中行动
    attackIds: [break_limit]
    unlockChapter: 7
    coreMove: false

progression:
  defaultProfile: CH02_MAIN_BearAwakening
  profiles:
    CH02_MAIN_BearAwakening:
      displayName: 第二章：魔剑觉醒
      chapter: 2
      unlockedSkills: [basic_attack, air_basic, launcher, air_chase, magic_bolt, ally_support]
      debugSkills: [break_limit]
      visibleSystems:
        bossProtectionHud: false
        combatStateHud: false
        breakLimitHint: false
    CH02_MAT_BeastPath:
      displayName: 第二章：黑林兽道
      chapter: 2
      unlockedSkills: [basic_attack, air_basic, launcher, air_chase, magic_bolt, ally_support]
      debugSkills: [break_limit]
      visibleSystems:
        bossProtectionHud: false
        combatStateHud: false
        breakLimitHint: false
    CH06_MAIN_MageLair:
      displayName: 第六章：魔法师老巢
      chapter: 6
      unlockedSkills: [basic_attack, air_basic, launcher, air_chase, magic_bolt, ally_support]
      debugSkills: []
      visibleSystems:
        bossProtectionHud: true
        combatStateHud: false
        breakLimitHint: false
    CH07_MAIN_PalaceAssault:
      displayName: 第七章：进攻王宫
      chapter: 7
      unlockedSkills: [basic_attack, air_basic, launcher, air_chase, magic_bolt, ally_support, break_limit]
      debugSkills: []
      visibleSystems:
        bossProtectionHud: true
        combatStateHud: false
        breakLimitHint: true


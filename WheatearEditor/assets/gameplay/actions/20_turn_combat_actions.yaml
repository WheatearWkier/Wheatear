    hitTime: 0.32
    recovery: 0.22
    tags: [Gameplay.TurnCombat, Gameplay.Combat, Category.Attack, Target.EnemySingle, Faction.Enemy]
    effects:
      - type: Damage
        attribute: attack
        value: 0.95
    signals: [turn.skill.apply, turn.skill.vfx, turn.skill.sfx]

  - id: turn.wild_pounce
    displayName: Wild Pounce

    effect: assets/vertical_slice/turn_combat/effects/vfx_turn_claw.png
    duration: 0.86
    startup: 0.18
    hitTime: 0.44
    recovery: 0.24
    tags: [Gameplay.TurnCombat, Gameplay.Combat, Category.Attack, Target.EnemySingle, Faction.Enemy]
    effects:
      - type: Damage
        attribute: attack
        value: 1.25
    signals: [turn.skill.apply, turn.skill.vfx, turn.skill.sfx]

  - id: turn.dark_orb
    displayName: Dark Orb
    description: Enemy dark magic with burn.
    icon: assets/vertical_slice/turn_combat/ui/icons/cmd_enemy_orb.png
    sound: assets/vertical_slice/turn_combat/audio/turn_magic.wav
    effect: assets/vertical_slice/turn_combat/effects/vfx_turn_dark.png
    duration: 0.92
    startup: 0.20
    hitTime: 0.46
    recovery: 0.26
    tags: [Gameplay.TurnCombat, Gameplay.Combat, Category.Skill, Target.EnemySingle, Faction.Enemy, Element.Dark]
    effects:
      - type: Damage
        attribute: magic
        value: 1.18
      - type: AddState
        state: burn
        value: 7
        turns: 2
        durationPolicy: turns
    signals: [turn.skill.apply, turn.skill.vfx, turn.skill.sfx]

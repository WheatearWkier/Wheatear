actions:
  - id: tactical.sword_slash
    displayName: Tactical Sword Slash
    description: Adjacent single target sword action.
    icon: assets/vertical_slice/tactical_combat/ui/icons/cmd_tac_attack.png
    sound: assets/vertical_slice/tactical_combat/audio/tac_slash.wav
    effect: assets/vertical_slice/tactical_combat/effects/vfx_tac_slash_{frame2}.png
    duration: 0.78
    startup: 0.16
    hitTime: 0.36
    recovery: 0.22
    tags: [Gameplay.TacticalCombat, Gameplay.Combat, Category.Attack, Target.Enemy, Range.Melee]
    effects:
      - type: Damage
        attribute: attack
        value: 1.00
    signals: [tactical.skill.apply, tactical.skill.vfx, tactical.skill.sfx]

  - id: tactical.aether_lance
    displayName: Aether Lance
    description: Three tile magic pierce with defense down.
    icon: assets/vertical_slice/tactical_combat/ui/icons/cmd_tac_magic.png
    sound: assets/vertical_slice/tactical_combat/audio/tac_magic.wav
    effect: assets/vertical_slice/tactical_combat/effects/vfx_tac_magic_{frame2}.png
    duration: 0.96
    startup: 0.20
    hitTime: 0.48
    recovery: 0.28
    tags: [Gameplay.TacticalCombat, Gameplay.Combat, Category.Skill, Target.Enemy, Range.Three, Element.Aether]
    effects:
      - type: Damage
        attribute: magic
        value: 1.25
      - type: AddState
        state: def_down
        value: 0.22
        turns: 2
        durationPolicy: turns
    signals: [tactical.skill.apply, tactical.skill.vfx, tactical.skill.sfx]

  - id: tactical.white_pulse
    displayName: White Pulse
    description: Three tile ally heal with regeneration.
    icon: assets/vertical_slice/tactical_combat/ui/icons/cmd_tac_heal.png
    sound: assets/vertical_slice/tactical_combat/audio/tac_heal.wav
    effect: assets/vertical_slice/tactical_combat/effects/vfx_tac_heal_{frame2}.png
    duration: 0.92
    startup: 0.14
    hitTime: 0.42
    recovery: 0.24
    tags: [Gameplay.TacticalCombat, Gameplay.Combat, Category.Skill, Category.Heal, Target.Ally, Range.Three, Element.White]
    effects:
      - type: Heal
        attribute: magic
        value: 1.05
      - type: AddState
        state: regen
        value: 8
        turns: 2
        durationPolicy: turns
    signals: [tactical.skill.apply, tactical.skill.vfx, tactical.skill.sfx]

  - id: tactical.guard_wait
    displayName: Tactical Guard
    description: End action and guard until next turn.
    icon: assets/vertical_slice/tactical_combat/ui/icons/cmd_tac_guard.png
    sound: assets/vertical_slice/tactical_combat/audio/tac_guard.wav
    effect: assets/vertical_slice/tactical_combat/effects/vfx_tac_guard_{frame2}.png
    duration: 0.58
    startup: 0.06
    hitTime: 0.24
    recovery: 0.18
    tags: [Gameplay.TacticalCombat, Gameplay.Combat, Category.Guard, Target.Self]
    effects:
      - type: AddState
        state: guard
        value: 0.55
        turns: 1
        durationPolicy: turns
    signals: [tactical.skill.apply, tactical.skill.vfx, tactical.skill.sfx]

  - id: tactical.tactical_potion
    displayName: Tactical Potion
    description: Consumable three tile ally recovery.
    icon: assets/vertical_slice/tactical_combat/ui/icons/cmd_tac_item.png
    sound: assets/vertical_slice/tactical_combat/audio/tac_heal.wav
    effect: assets/vertical_slice/tactical_combat/effects/vfx_tac_heal_{frame2}.png
    duration: 0.72
    startup: 0.10
    hitTime: 0.34
    recovery: 0.20
    tags: [Gameplay.TacticalCombat, Gameplay.Combat, Category.Item, Category.Heal, Target.Ally, Range.Three]
    effects:
      - type: Heal
        attribute: item
        value: 0.85
    signals: [tactical.skill.apply, tactical.skill.vfx, tactical.skill.sfx]

  - id: tactical.enemy_strike
    displayName: Tactical Enemy Strike
    description: Enemy adjacent melee action.
    icon: assets/vertical_slice/tactical_combat/ui/icons/cmd_tac_enemy.png
    sound: assets/vertical_slice/tactical_combat/audio/tac_hit.wav
    effect: assets/vertical_slice/tactical_combat/effects/vfx_tac_slash_{frame2}.png
    duration: 0.72
    startup: 0.16
    hitTime: 0.34
    recovery: 0.22
    tags: [Gameplay.TacticalCombat, Gameplay.Combat, Category.Attack, Target.Enemy, Faction.Enemy, Range.Melee]

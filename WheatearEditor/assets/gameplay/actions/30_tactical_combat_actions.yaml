    description: Enemy ranged dark magic with burn.
    icon: assets/vertical_slice/tactical_combat/ui/icons/cmd_tac_enemy_magic.png
    sound: assets/vertical_slice/tactical_combat/audio/tac_magic.wav
    effect: assets/vertical_slice/tactical_combat/effects/vfx_tac_dark_{frame2}.png
    duration: 0.90
    startup: 0.20
    hitTime: 0.46
    recovery: 0.24

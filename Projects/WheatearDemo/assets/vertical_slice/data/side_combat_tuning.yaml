schema: wheatear.side_combat.tuning.v1
version: 0.8.0

# 战斗手感总原则：
# - 横版纵深动作不依赖通用物理引擎自动驱动跳跃/浮空。
# - X/Y 地面移动、RuntimeAirHeight、重力、滞空、受击硬直、击飞全部由本表和战斗状态机控制。
# - 跳跃高度主要看 jumpImpulse；下落速度主要看 gravity；空中连击滞空主要看 attackerAirImpulse / targetAirFallStep / hitStun。
player:
  moveSpeed: 5.55
  maxJumps: 1
  jumpImpulse: 8.8
  gravity: 23.0
  airControl: 15.0
  jumpBufferTime: 0.16
  coyoteTime: 0.10
  laneSpeedScale: 0.72
  laneAcceleration: 32.0
  groundAcceleration: 44.0
  groundFriction: 20.0
  basicCooldown: 0.17
  basicFinisherExtraCooldown: 0.07
  launcherCooldown: 0.38
  magicBoltCooldown: 0.62
  allySupportCooldown: 4.0
  dashCooldown: 1.00
  healItemCooldown: 5.0
  manaItemCooldown: 5.0
  attackBuffItemCooldown: 10.0
  dashManaCost: 16.0
  dashSpeed: 10.5
  dashInvulnerableTime: 0.18
  basicChainWindow: 0.76
  launcherChainWindow: 0.86
  magicChainWindow: 0.82
  supportChainWindow: 1.0

combat:
  comboDropDelay: 1.20
  hitInvulnerableTime: 0.035
  defenseBase: 100.0
  minDamage: 1.0

feedback:
  hitPauseTimeScale: 0.10
  breakLimitCinematicDuration: 3.0
  breakLimitCinematicTimeScale: 0.12
  breakLimitCameraZoom: 1.30
  breakLimitCameraOffset: [0.0, 0.25]
  jumpSound: assets/vertical_slice/side_combat/audio/jump.wav
  landSound: assets/vertical_slice/side_combat/audio/land.wav
  jumpSoundVolume: 0.38
  landSoundVolume: 0.40

# 空中普攻是基础连击核心：每次命中都会给玩家一点上抬和滞空，但双方仍会慢慢下降。
# 断限追击后续作为高手机制开放，用来重置空中行动并再次抬高连击高度。
airCombo:
  airActionLimit: 3
  airActionLimitAfterBreak: 3
  breakLimitEnabled: false
  breakLimitDebugKeyEnabled: false
  showBreakLimitHint: false
  airBasicCooldown: 0.14
  airChaseCooldown: 0.32
  breakLimitCooldown: 3.0
  breakLimitMinCombo: 4
  breakLimitGaugeCost: 1.5
  magicSwordGaugeMax: 3.0
  gaugeGainGroundHit: 0.10
  gaugeGainAirHit: 0.16
  breakLimitMaxHeight: 3.00
  breakLimitFallingVelocity: 2.3
  breakLimitHangImpulse: 3.1
  breakLimitHeightBoost: 0.36
  groundThreatHeight: 1.25
  highAirSafetyHeight: 2.45

protection:
  bossProtectionMax: 100.0
  bossProtectionDecayPerSecond: 36.0
  bossProtectionLimitTime: 1.15
  bossProtectionForceFallVelocity: -6.0
  bossProtectionBreakLimitThreshold: 0.0
  breakLimitProtectionReduce: 100.0
  groundResetDelay: 0.20
  showBossProtectionHud: false
  showCombatStateHud: false

enemy:
  initialAttackDelay: 0.24
  attackRangePadding: 0.60
  laneAttackPadding: 0.36
  bossPreferredRangeBonus: 0.18
  gruntMoveSpeedScale: 0.88
  bossMoveSpeedScale: 0.72
  gruntLaneSpeedScale: 0.68
  bossLaneSpeedScale: 0.54
  xApproachAcceleration: 24.0
  xBrakeAcceleration: 20.0
  laneApproachAcceleration: 18.0
  laneBrakeAcceleration: 16.0
  bearBoss:
    moveSpeed: 3.75
    aggroRange: 14.0
    attackRange: 1.72
    preferredRange: 1.08
    attackInterval: 0.82
    laneTolerance: 0.66
    midHealthThreshold: 0.74
    lowHealthThreshold: 0.44
    midAttackInterval: 0.66
    lowAttackInterval: 0.52
    chargeDistance: 2.15
    shockwaveDistance: 2.35
    chargeSpeed: 7.20

pickup:
  pickupRadius: 0.45
  attractRadius: 2.25
  attractSpeed: 6.0

movement:
  laneMinY: -3.55
  laneMaxY: 0.25
  laneSpeedScale: 1.0
  laneAcceleration: 30.0
  sortScale: 0.015

